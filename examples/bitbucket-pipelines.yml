# Copy to bitbucket-pipelines.yml at the root of the consuming Bitbucket repository.
#
# Setup — Repository settings -> Repository variables:
#   ANTHROPIC_API_KEY (secured)   — or OPENROUTER_API_KEY / OPENAI_API_KEY
#                                   plus PR_REVIEW_MODEL for non-Anthropic providers
#   BITBUCKET_TOKEN   (secured)   — repository access token with the
#                                   pullrequest:write scope, used by --post to
#                                   create inline PR comments
#
# Brain freshness: use `secondpair init` hooks locally (pre-commit / pre-push).
# Commit `.secondpair/index.json`. Do not rely on CI to rebuild the index.
#
# Concurrency: Bitbucket Pipelines has no per-PR queue/cancel key in YAML
# (unlike GitHub Actions' `concurrency:` or GitLab's `resource_group:`).
# secondpair's dedupe check is read-then-write, so two pipelines racing on
# the same PR (rapid re-push) can both post. Mitigate at the repo level:
# Repository settings -> Pipelines -> "Limit concurrent pipeline runs",
# or accept the (rare, self-healing on next push) risk.

pipelines:
  pull-requests:
    "**":
      - step:
          name: PR Review Agent
          image: node:20
          script:
            - |
              if [ ! -f .secondpair/index.json ]; then
                echo "WARNING: .secondpair/index.json missing — diff-only review."
              fi
            # --omit=optional: Bitbucket never needs @octokit/rest (github-only)
            # or the codemap's tree-sitter/MCP deps. Drop --omit=optional if you
            # also want `secondpair init`/`index` (codemap context) on this box.
            - npm install -g secondpair --omit=optional
            - secondpair review --post --fail-on high
          artifacts:
            - pr-review-report.json
