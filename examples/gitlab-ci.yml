# GitLab CI — PR review gate with inline MR discussions.
#
# Prerequisites:
#   - Commit `.secondpair/index.json` from local `secondpair init` / hooks
#   - CI/CD variable for the LLM: ANTHROPIC_API_KEY (or OPENAI_ / OPENROUTER_ / PR_REVIEW_CLI_COMMAND)
#   - CI/CD variable GITLAB_TOKEN: access token with `api` scope, for --post
#     (CI_JOB_TOKEN cannot post MR notes; drop --post to only gate + emit JSON)

review:
  image: node:20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # Required: secondpair's dedupe check is read-then-write (checks existing
  # note ids, then posts). resource_group serializes runs on the same MR so
  # a fast re-push can't race an in-flight run and double-post.
  resource_group: pr-review-$CI_MERGE_REQUEST_IID
  script:
    - |
      if [ ! -f .secondpair/index.json ]; then
        echo "WARNING: .secondpair/index.json missing — diff-only review."
      fi
    - npm install -g secondpair
    # Project/MR auto-detected from CI_PROJECT_ID / CI_MERGE_REQUEST_IID.
    - pr-review review --post --fail-on high --json pr-review-report.json
  artifacts:
    when: always
    paths:
      - pr-review-report.json
