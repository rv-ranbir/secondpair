# Example .pr-review.yml — place at the root of the consuming repository.
# Every key is optional; these are the defaults unless noted.

# Fail the CI check when any finding is at or above this severity.
# Default is "off" (report-only, never blocks merge) — this example shows it
# turned on. Set to "off" any time to make the merge gate optional again.
fail_on: high            # critical | high | medium | low | info | off

# Drop findings the model rated below this confidence (0..1).
min_confidence: 0.5

# Paths excluded from review AND from the codemap index (glob patterns,
# merged with built-in defaults like node_modules/, dist/, lockfiles).
ignore:
  - "**/*.gen.ts"
  - "docs/**"

# Token budget for repo context injected into the review prompt.
context_token_budget: 8000

# Inline the full source of the top-N related files (importers first) into the
# prompt, on top of the summary/symbol context. 0 disables.
context_snippets: 3

# Free-text instructions appended to the review prompt.
custom_instructions: |
  Flag missing JSDoc on exported functions.
  We use dependency injection — flag direct instantiation of services.

# Disable finding categories entirely.
categories:
  naming: false

# Sampling temperature. OpenAI-compatible providers already default to 0;
# setting this also forces it on Anthropic (which disables adaptive thinking).
# temperature: 0

# Caps against pad-spam: beyond these, lowest-confidence findings are dropped.
limits:
  max_findings_per_file: 5
  max_total: 30

# Second drop-only LLM pass that removes findings the model would walk back
# when challenged. Costs one extra call per review. Default: false.
self_critique: false

# Redact common secrets before sending diffs and context to the model.
redact_secrets: true

# Additional JavaScript regular expressions whose matches should be redacted.
redact_patterns: []

# Persist finding ids marked "won't fix" to .pr-review-suppressions.yml.
write_suppressions: false

# Custom-instructions file, read if custom_instructions (above) is empty.
# Loses to .secondpair/instructions.mdc|.md when either of those exist.
custom_instructions_file: .pr-review-instructions.md

# Above this many diff tokens, switch to a single cheaper high-level pass
# (critical/high findings only, no parallel lenses, no self-critique) instead
# of full per-chunk review. Set null to disable and always do a full review.
huge_pr_token_threshold: 120000

# Deterministic (non-LLM) hook/error-handling/control-flow signal detection
# on added lines, surfaced to the model alongside the diff per chunk.
signal_detector: true

# Fan out concurrent security/correctness/quality "lens" LLM calls per chunk
# instead of one combined call. More thorough, costs more calls. Ignored for
# huge-PR high-level reviews (see huge_pr_token_threshold).
parallel_agents: true

# LLM-assisted merge of near-duplicate findings across lenses/chunks, on top
# of the always-on exact-fingerprint dedup.
semantic_dedup: true

# Hard cap on diff chunks reviewed per run (token-budget chunking). Extra
# chunks are skipped with a warning log instead of being sent/billed. Set
# null to disable the cap.
max_diff_chunks: 20
