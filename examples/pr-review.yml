# Copy to .github/workflows/pr-review.yml in the consuming repository.
#
# Prerequisites:
#   1. Commit `.secondpair/index.json` (from `secondpair init` + hooks locally)
#   2. Store an LLM API key as a repo secret
#
# Checkout is required so the action can read the committed brain.
#
# Security note: `actions/checkout` on `pull_request` checks out the PR's
# own content, which means `.pr-review.yml` (redact_patterns, custom
# instructions) is attacker-controlled for external contributors. Don't
# put anything in this workflow that trusts PR-supplied config as if it
# came from a maintainer.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Required: secondpair's dedupe check is read-then-write (checks existing
# comment ids, then posts). Two runs racing on the same PR (e.g. a fast
# re-push re-triggering `synchronize` before the first run finishes) can
# both pass the check and double-post. This queues re-triggers on the same
# PR and cancels the stale one instead of letting them race.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review PR
        uses: YOUR_GITHUB_USERNAME/secondpair@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or another provider:
          # openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # model: anthropic/claude-sonnet-4.5
          fail-on: high
